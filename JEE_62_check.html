<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>JEE 훈련자 매뉴얼 · 62기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#2C5282;
    --amber-soft:#4A90C4;
    --paper:#FFFFFF;
    --paper-line:#DCE6F0;
    --sage:#1A2F4E;
    --sage-soft:#EAF1F8;
    --clay:#1A2F4E;
    --ink:#1E2D3D;
    --ink-soft:#6B7C93;
    --shadow: 0 12px 30px rgba(0,0,0,0.16);

    /* chrome (header/background) tones — overridden per skin */
    --chrome-bg-1:#F0F4F9;
    --chrome-bg-2:#E3EBF4;
    --chrome-bg-3:#D3E0EC;
    --chrome-deep-rgb:211,224,236;
    --chrome-sub:#3A4C63;
    --chrome-mute:#6B7C93;
    --chrome-track:#D7E2EE;
    --chrome-track-deep:#C3D3E3;
    --chrome-panel-bg: rgba(26,47,78,0.05);
    --chrome-panel-border: rgba(26,47,78,0.12);
    --chrome-text:#1E2D3D;

    /* content highlight boxes / accent text — overridden per skin */
    --box-bg:#EAF1F8;
    --box-bg-alt:#F3F7FB;
    --box-text:#1A2F4E;
    --bubble1-bg:#E7EBF0; --bubble1-text:#33404D;
    --bubble2-bg: var(--sage-soft); --bubble2-text:#16283F;
    --check-bg:#FFFFFF;
    --cal-border:#DCDCD6;
    --cal-prerow-bg:#FAFAFA;
    --cal-header-bg:#5C9C79;
    --cal-header-text:#FFFFFF;
    --cal-header-sun:#E9F7EE;
    --cal-special-bg:#F5EEDD; --cal-special-text:#8A6A34;
    --cal-opening-bg:#E4EEF7; --cal-opening-text:#33546E;
    --cal-holiday-bg:#F7EBDD; --cal-holiday-text:#A5652F;
    --cal-holidaysun-text:#A3492F;
    --cal-end13-bg:#E5F0E5; --cal-end13-text:#3E7A45;
    --cal-end14-bg:#E4EEF7; --cal-end14-text:#33546E;

    /* font scale — adjusted by the text-size control */
    --font-scale:1;
  }

  /* ---------- Skin: 퍼플 ---------- */
  body[data-theme="purple"]{
    --chrome-bg-1:#F2F1F6;
    --chrome-bg-2:#EAE8F2;
    --chrome-bg-3:#E1DEEE;
    --chrome-deep-rgb:225,222,238;
    --amber:#7C5CFC;
    --amber-soft:#B9A6FF;
    --sage:#7C5CFC;
    --sage-soft:#EBE6FC;
    --clay:#5B3FA6;
    --chrome-sub:#5B5670;
    --chrome-mute:#87829C;
    --chrome-track:#D8D4E8;
    --chrome-track-deep:#C4BFDC;
    --chrome-panel-bg: rgba(60,40,100,0.05);
    --chrome-panel-border: rgba(60,40,100,0.12);
    --paper:#FFFFFF;
    --paper-line:#E7E4F0;
    --ink:#221F2E;
    --ink-soft:#726C86;
    --chrome-text:#221F2E;
    --box-bg:#F1EDFC;
    --box-bg-alt:#F6F2FE;
    --box-text:#5B3FA6;
    --bubble1-bg:#EDEBF2; --bubble1-text:#332E42;
    --bubble2-bg: var(--sage-soft); --bubble2-text:#3A1F5C;
    --check-bg:#FFFFFF;
    --cal-border:#DEDAEA;
    --cal-prerow-bg:#FAFAFA;
    --cal-header-bg:#8873D6;
    --cal-header-text:#FFFFFF;
    --cal-header-sun:#EFEAFC;
    --cal-special-bg:#F1ECDD; --cal-special-text:#7A6134;
    --cal-opening-bg:#E9E5F5; --cal-opening-text:#4B3E75;
    --cal-holiday-bg:#F3EADD; --cal-holiday-text:#93602F;
    --cal-holidaysun-text:#8A4A3E;
    --cal-end13-bg:#E7EFE3; --cal-end13-text:#4B7A45;
    --cal-end14-bg:#E9E5F5; --cal-end14-text:#4B3E75;
  }

  /* ---------- Skin: 다크 ---------- */
  body[data-theme="dark"]{
    --chrome-bg-1:#0E0E13;
    --chrome-bg-2:#0A0A0F;
    --chrome-bg-3:#060608;
    --chrome-deep-rgb:6,6,8;
    --amber:#8B5CF6;
    --amber-soft:#B39DFF;
    --sage:#34D399;
    --sage-soft:#1B3A2E;
    --clay:#D98055;
    --chrome-sub:#C9C9D6;
    --chrome-mute:#8B8B9A;
    --chrome-track:#2A2A35;
    --chrome-track-deep:#1C1C24;
    --chrome-panel-bg: rgba(255,255,255,0.05);
    --chrome-panel-border: rgba(255,255,255,0.10);
    --paper:#16161C;
    --paper-line:#2A2A33;
    --ink:#EDEDF2;
    --ink-soft:#9C9CAA;
    --chrome-text:#F5F5FA;
    --box-bg:#221E33;
    --box-bg-alt:#281F3A;
    --box-text:#C9A8FF;
    --bubble1-bg:#232330; --bubble1-text:#D8D8E4;
    --bubble2-bg: var(--sage-soft); --bubble2-text:#8FF0C4;
    --check-bg:#232330;
    --cal-border:#3C3C48;
    --cal-prerow-bg:#1D1D25;
    --cal-header-bg:#33304A;
    --cal-header-text:#D8D4EA;
    --cal-header-sun:#C9A8FF;
    --cal-special-bg:#332A1E; --cal-special-text:#E0C077;
    --cal-opening-bg:#232A3E; --cal-opening-text:#9FC0FA;
    --cal-holiday-bg:#332A1E; --cal-holiday-text:#E0A26B;
    --cal-holidaysun-text:#E28B72;
    --cal-end13-bg:#1E3327; --cal-end13-text:#7FD9A8;
    --cal-end14-bg:#232A3E; --cal-end14-text:#9FC0FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 90% at 50% 0%, var(--chrome-bg-1) 0%, var(--chrome-bg-2) 45%, var(--chrome-bg-3) 100%);
    min-height:100vh;
    transition: background .3s ease;
    font-family:'Noto Sans KR', sans-serif;
    color: var(--chrome-text);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, var(--chrome-bg-3) 0%, rgba(var(--chrome-deep-rgb),0.97) 80%, rgba(var(--chrome-deep-rgb),0.0) 100%);
    padding:22px 20px 14px;
  }
  .eyebrow{
    font-family:'Noto Sans KR', sans-serif;
    font-size:calc(11px * var(--font-scale)); letter-spacing:0.18em; text-transform:uppercase;
    color: var(--amber-soft); opacity:0.9; margin-bottom:6px;
  }
  h1{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:calc(26px * var(--font-scale));
    margin:0 0 2px;
    color: var(--chrome-text);
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:calc(13px * var(--font-scale)); color:var(--chrome-sub); margin:0 0 12px;
  }

  /* ---------- Settings row: skin picker + font size ---------- */
  .settings-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin:0 0 16px;
  }
  .theme-picker{ display:flex; gap:8px; }
  .theme-swatch{
    width:24px; height:24px; border-radius:50%; padding:0;
    border:2px solid rgba(255,255,255,0.25); cursor:pointer;
    background: linear-gradient(135deg, var(--sw1) 0%, var(--sw2) 100%);
    box-shadow:0 0 0 0 transparent; transition: all .2s ease;
  }
  .theme-swatch[data-theme="navy"]{ --sw1:#E3EBF4; --sw2:#1A2F4E; }
  .theme-swatch[data-theme="purple"]{ --sw1:#EAE8F2; --sw2:#7C5CFC; }
  .theme-swatch[data-theme="dark"]{ --sw1:#0A0A0F; --sw2:#8B5CF6; }
  .theme-swatch.active{
    border-color: var(--amber-soft);
    box-shadow: 0 0 0 3px rgba(232,163,61,0.28);
  }
  .font-picker{
    display:flex; align-items:center; gap:8px;
    font-family:'Noto Sans KR', sans-serif;
  }
  .font-btn{
    width:26px; height:26px; border-radius:8px; border:1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: var(--chrome-sub);
    font-size:12px; font-weight:700; cursor:pointer; line-height:1;
  }
  .font-btn:disabled{ opacity:0.35; cursor:default; }
  .font-label{ font-size:10.5px; color: var(--chrome-mute); min-width:44px; text-align:center; }

  /* Porch-light progress path — the signature element */
  .path-wrap{
    display:flex; align-items:center; gap:0;
    padding: 4px 2px 2px;
  }
  .path-step{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
    background:none; border:none; color:inherit; padding:4px 0;
  }
  .path-dot{
    width:11px; height:11px; border-radius:50%;
    background: var(--chrome-track);
    box-shadow: inset 0 0 0 2px var(--chrome-track-deep);
    transition: all .25s ease;
    position:relative;
  }
  .path-step.done .path-dot{
    background: var(--sage);
    box-shadow: inset 0 0 0 2px var(--chrome-track-deep), 0 0 0 3px rgba(92,122,94,0.25);
  }
  .path-step.active .path-dot{
    background: var(--amber);
    box-shadow: 0 0 0 5px rgba(232,163,61,0.28), 0 0 14px 2px rgba(232,163,61,0.55);
  }
  .path-line{
    flex:1.4; height:2px; background: var(--chrome-track-deep); margin-top:5.5px; align-self:flex-start; position:relative; top:6px;
  }
  .path-line.done{ background: var(--sage); }
  .path-label{
    font-family:'Noto Sans KR', sans-serif;
    font-size:calc(9.5px * var(--font-scale)); color: var(--chrome-mute); letter-spacing:0.02em;
  }
  .path-step.active .path-label{ color: var(--amber-soft); font-weight:700; }

  /* progress summary bar */
  .summary{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:16px; padding:10px 14px;
    background: var(--chrome-panel-bg);
    border:1px solid var(--chrome-panel-border);
    border-radius:12px;
    font-size:calc(12.5px * var(--font-scale));
  }
  .summary strong{ color:var(--amber-soft); font-family:'Noto Sans KR',sans-serif; }
  .summary-bar{
    flex:1; height:5px; margin:0 12px; border-radius:3px; overflow:hidden;
    background: var(--chrome-panel-border);
  }
  .summary-bar > div{
    height:100%; background: linear-gradient(90deg, var(--amber), var(--sage));
    border-radius:3px; transition: width .4s ease;
  }

  /* ---------- Main / cards ---------- */
  main{ padding: 6px 16px 60px; flex:1; }

  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius:16px;
    margin:14px 0;
    box-shadow: var(--shadow);
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.06);
    scroll-margin-top: 190px;
  }
  .card-head{
    width:100%; text-align:left; background:none; border:none;
    display:flex; align-items:center; gap:14px;
    padding:16px 16px;
    cursor:pointer;
    font-family:inherit; color:inherit;
  }
  .badge{
    flex:none;
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:calc(18px * var(--font-scale));
    background: radial-gradient(circle at 35% 30%, var(--amber-soft), var(--amber) 70%);
    color:#FFFFFF;
    box-shadow: 0 0 0 4px rgba(26,47,78,0.14);
    position:relative;
  }
  .card.section-done .badge{
    background: radial-gradient(circle at 35% 30%, #B9D0BA, var(--sage) 75%);
    color:#FFFFFF;
    box-shadow: 0 0 0 4px rgba(92,122,94,0.14);
  }
  .head-text{ flex:1; min-width:0; }
  .head-title{ font-family:'Noto Sans KR', sans-serif; font-weight:700; font-size:calc(16.5px * var(--font-scale)); line-height:1.35; }
  .head-meta{ font-family:'Noto Sans KR', sans-serif; font-size:calc(10.5px * var(--font-scale)); color: var(--ink-soft); margin-top:3px; letter-spacing:0.03em; }
  .chevron{ flex:none; width:20px; height:20px; color:var(--ink-soft); transition: transform .25s ease; }
  .card.open .chevron{ transform: rotate(180deg); }

  .card-body{
    max-height:0; overflow:hidden; transition: max-height .35s ease;
  }
  .card.open .card-body{ max-height:none; }
  .card-body-inner{ padding: 2px 18px 20px; border-top:1px solid var(--paper-line); }
  .intro-text{ font-size:calc(13.5px * var(--font-scale)); line-height:1.7; color:var(--ink); opacity:0.88; margin:14px 0 6px; }

  .item{
    display:flex; gap:10px; align-items:flex-start;
    padding:11px 0; border-bottom:1px dashed var(--paper-line);
  }
  .item:last-child{ border-bottom:none; }
  .check{
    flex:none; width:22px; height:22px; margin-top:1px; border-radius:6px;
    border:2px solid var(--paper-line); background:var(--check-bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .15s ease;
  }
  .check svg{ width:13px; height:13px; opacity:0; transition:opacity .15s ease; }
  .item.checked .check{ background:var(--sage); border-color:var(--sage); }
  .item.checked .check svg{ opacity:1; }
  .item.checked .item-text{ color:var(--ink-soft); text-decoration: line-through; text-decoration-color:#C9BC9C; }
  .item-text{ font-size:calc(14px * var(--font-scale)); line-height:1.55; }
  .item-note{
    display:block; margin-top:5px; font-size:calc(12.5px * var(--font-scale)); color:var(--clay);
    background:var(--box-bg-alt); border-radius:8px; padding:7px 10px; line-height:1.5;
  }

  .duty{ margin:16px 0; }
  .duty-title{ font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:calc(14.5px * var(--font-scale)); margin-bottom:8px; display:flex; gap:8px; align-items:baseline;}
  .duty-num{ font-family:'Noto Sans KR',sans-serif; color:var(--clay); font-size:calc(12px * var(--font-scale)); }
  .subitem{ font-size:calc(13.5px * var(--font-scale)); line-height:1.6; padding:6px 0 6px 4px; border-left:2px solid var(--paper-line); padding-left:12px; margin-bottom:6px; }

  .rule{ font-size:calc(13.5px * var(--font-scale)); line-height:1.65; padding:9px 0; border-bottom:1px dashed var(--paper-line); display:flex; gap:10px;}
  .rule:last-child{ border-bottom:none; }
  .rule-num{ font-family:'Noto Sans KR',sans-serif; font-size:calc(11.5px * var(--font-scale)); color:var(--clay); flex:none; padding-top:2px; }

  table.diag{ width:100%; border-collapse:collapse; font-size:calc(12.5px * var(--font-scale)); margin:14px 0; }
  table.diag th, table.diag td{ border:1px solid var(--paper-line); padding:8px 6px; text-align:left; vertical-align:top; line-height:1.5;}
  table.diag th{ background:var(--box-bg); font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:calc(12px * var(--font-scale));}
  table.diag td.result{ font-weight:700; }
  .r-gyeolsin{ color:#8A5A24; } .r-hwaksin{ color:#3F6B44; } .r-boryu{ color:#A14A3B; } .r-imi{ color:#5A5A9C; } .r-meori{ color:#7A6A3E; }

  .dialogue{ margin:12px 0; }
  .turn{ display:flex; margin:7px 0; }
  .turn.hun{ justify-content:flex-start; }
  .turn.gyeol{ justify-content:flex-end; }
  .bubble{ max-width:86%; padding:9px 13px; border-radius:14px; font-size:calc(13.5px * var(--font-scale)); line-height:1.6; }
  .turn.hun .bubble{ background:var(--bubble1-bg); border-bottom-left-radius:4px; color:var(--bubble1-text);}
  .turn.gyeol .bubble{ background:var(--bubble2-bg); border-bottom-right-radius:4px; color:var(--bubble2-text);}
  .speaker{ font-family:'Noto Sans KR',sans-serif; font-size:calc(9.5px * var(--font-scale)); opacity:0.65; display:block; margin-bottom:2px;}

  .script-line{
    font-size:calc(13.5px * var(--font-scale)); line-height:1.7; margin:8px 0; padding:10px 12px;
    background:var(--box-bg); border-left:3px solid var(--amber); border-radius:0 8px 8px 0;
  }
  .para{ font-size:calc(13.5px * var(--font-scale)); line-height:1.75; margin:10px 0; color:var(--ink); }
  .para b{ color:var(--box-text); }

  .qq-item{ display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--paper-line); align-items:flex-start; }
  .qq-item:last-child{ border-bottom:none; }
  .qq-num{ font-family:'Noto Sans KR',sans-serif; font-weight:700; color:var(--clay); font-size:calc(15px * var(--font-scale)); flex:none; width:20px;}

  .divider-label{
    font-family:'Noto Sans KR',sans-serif; font-size:calc(10.5px * var(--font-scale)); letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft); margin: 20px 0 8px; padding-top:14px; border-top:1px solid var(--paper-line);
  }

  footer{ text-align:center; padding: 10px 20px 40px; font-size:calc(11px * var(--font-scale)); color: var(--chrome-mute); }

  /* ---------- Tablet layout ---------- */
  @media (min-width:700px){
    .app{ max-width:680px; }
    header{ padding:30px 34px 18px; }
    main{ padding:10px 34px 70px; }
    h1{ font-size:calc(30px * var(--font-scale)); }
    .card-body-inner{ padding:2px 26px 22px; }
    .card-head{ padding:18px 20px; }
  }

  .form-ref{ margin:16px 0; }
  .form-ref img{
    width:100%; display:block; border-radius:10px; border:1px solid var(--paper-line);
    cursor: zoom-in;
  }
  .form-ref .form-label{
    font-family:'Noto Sans KR', sans-serif; font-size:calc(10.5px * var(--font-scale)); color:var(--ink-soft);
    letter-spacing:0.03em; margin-top:6px; text-align:center;
  }

  /* lightbox for tapping a form image to view full-size */
  .lightbox{
    position:fixed; inset:0; background:rgba(10,12,20,0.92); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }

  .header-icon{ width:30px; height:22px; object-fit:contain; vertical-align:middle; margin-left:8px; opacity:0.9; }

  /* ---------- Floating home button ---------- */
  .home-btn{
    position:fixed; right:18px; bottom:22px; z-index:30;
    width:46px; height:46px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(circle at 35% 30%, var(--amber-soft), var(--amber) 75%);
    color:#3A2A0E; box-shadow: var(--shadow);
    cursor:pointer; opacity:0; pointer-events:none; transform: translateY(8px) scale(0.9);
    transition: opacity .25s ease, transform .25s ease;
  }
  .home-btn.show{ opacity:1; pointer-events:auto; transform: translateY(0) scale(1); }
  .home-btn svg{ width:20px; height:20px; }
  @media (min-width:700px){
    .home-btn{ right: calc(50% - 340px); bottom:28px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">전도폭발훈련 62기 · 훈련자(2) 함께 사용</div>
    <h1>JEE 훈련자 매뉴얼 <img class="header-icon" src="" id="headerIcon" alt=""></h1>
    <p class="subtitle">☺ 학기 중에 계속 지참하세요</p>

    <div class="settings-row">
      <div class="theme-picker" id="themePicker">
        <button class="theme-swatch" data-theme="navy" title="네이비"></button>
        <button class="theme-swatch" data-theme="purple" title="퍼플"></button>
        <button class="theme-swatch" data-theme="dark" title="다크"></button>
      </div>
      <div class="font-picker">
        <button class="font-btn" id="fontMinus" aria-label="글씨 작게">가-</button>
        <span class="font-label" id="fontSizeLabel">보통</span>
        <button class="font-btn" id="fontPlus" aria-label="글씨 크게">가+</button>
      </div>
    </div>

    <div class="path-wrap" id="pathWrap"></div>

    <div class="summary">
      <span>체크리스트</span>
      <div class="summary-bar"><div id="summaryFill" style="width:0%"></div></div>
      <strong id="summaryCount">0/0</strong>
    </div>
  </header>

  <main id="main"></main>

  <footer>훈련자는 곧 훈련생의 영적 부모입니다 · 62기</footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<button class="home-btn" id="homeBtn" aria-label="처음으로">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11.5 12 4l9 7.5"></path>
    <path d="M5.5 9.5V20a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V20a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5"></path>
  </svg>

{
  id:3, page:'7p', title:'전도 현장 실습 시 유의사항', type:'checklist',
  items:[
    {t:'전도대상자의 집이나 지역에 가능한 한 일찍 도착한다.', note:'먼 곳을 갈 경우 교통 혼잡을 예상한다.'},
    {t:'출발 전 기도하고 출발한다.', note:'통성기도 · 대상자가 순적히 준비되시도록 · 방해하는 환경과 사단을 물리쳐 주시도록 · 훈련생들이 확신을 갖고 좋은 경험과 결과를 얻도록.'},
    {t:'이동 중(차 안)에는 잡담하지 말고, 언제나 긍정적인 태도로 전도폭발·대상자 이해에 도움 되는 이야기만 한다.', note:'복음제시의 어느 부분을 맡을지 미리 약속해 둔다.'},
    {t:'도착해서: 다른 차를 막지 않게 주차하고, 밖에서는 대화를 피한다.', note:'문 앞에서 여자가 제일 잘 보이는 앞자리에 서되, 너무 가깝게 서지 말고 항상 웃는 얼굴을 한다.'},
    {t:'현관문 앞에서: 여자팀원이 위협적이지 않게 잘 보이는 곳에 서고, “좋은 소식을 가지고 왔다”고 안내한다.', note:'“안녕하세요? 저는 …이구요, 저희는 지구촌교회에서 왔습니다. 잠시 들어가도 될까요?” — “곤란하다”고 하면 이유는 묻지 말고 다음 방문 일정만 약속한다.'},
    {t:'자리를 잡을 때: 대상자를 가장 편한 자리에 앉게 하고, 복음제시자는 대화에 적절한 자리에 앉는다.', note:'다른 팀원은 정면이 아닌 측면에 앉아 함께 경청한다.'},
    {t:'복음제시 중 다른 팀원은 경청하고, 눈뜨고 중보기도한다.', note:'전도자가 잘 전하도록 · 대상자가 잘 듣고 결신하도록 · 사단이 틈타지 못하도록. 방해 요소(아기·손님 등)는 팀원이 조용히 처리하고, 이유질문 이후에는 전도자에게 위임하고 앞지르지 않는다.'},
    {t:'끝날 때까지 산만하게 움직이지 않는다.'},
    {t:'다른 교회·교파에 대한 비판적 대화는 피한다.'},
    {t:'싫증나는 순간이 기도를 막는 마귀의 역사임을 알고, 그럴수록 더 정신 차려 기도한다.'},
    {t:'옆에서 기도하는 팀원도 “나도 전도한다”는 자부심을 갖는다.'},

    {t:'복장·휴대품: 때와 장소에 맞는 옷차림, 단정한 외모, 큰 성경은 손에 들지 말고 가방에 넣는다.'},
    {t:'[중요] 현장실습을 마치고 돌아오면서', note:'긍정적인 면부터 평가 → 더 잘할 수 있는 점을 세워주는 마음으로 이야기 → 오늘 배운 것 확인 → 공개보고회 자료 기록 및 대상자를 위해 기도.'},
  ]
},

{
  id:6, page:'13p', title:'칠일 후 재방문 시범', type:'dialogue',
  dialogue:[
    ['gyeol','(딩동!) 누구세요?'],
    ['hun','안녕하세요? 저희는 지난번에 방문했던 OO교회 OOO집사입니다. 지난번에 같이 왔던 OOO 집사님, 이분은 OOO집사님입니다.'],
    ['gyeol','안녕하세요? 여기 앉으세요.'],
    ['hun','그동안 잘 지내셨어요? 오늘은 더 밝고 예뻐 보이시는데, 지난 한 주간 무슨 좋은 일이라도 있으셨나요?'],
    ['gyeol','글쎄요. 별 특별한 일이 있었던 건 아닌데 제 마음이 즐겁고 평안한 것을 느꼈어요.'],
    ['hun','아! 그동안 영생의 기쁨을 누리고 계셨네요. 그런데 제가 지난주에 교회 앞에서 기다렸는데 자매님을 볼 수가 없었어요. 무슨 급한 일이라도 있으셨어요?'],
    ['gyeol','죄송합니다. 사실 가려고 했었는데 막상 가려니까 쑥스럽고 부끄러워서 망설이다가 시간이 늦어버렸어요.'],
    ['hun','그러셨군요. 처음엔 저도 교회 가는 것이 무척 어색하고 쑥스러웠어요. 그런데 옆집 집사님께서 새가족반으로 안내해 주셨지요. 거기엔 저처럼 처음 오시는 분들이 많더군요. 4주 동안 교제하고 조장의 도움으로 교회생활을 배웠고, 목장모임에도 나가게 되어 믿음이 자라게 되었어요. 자매님도 용기를 내 보세요.'],
    ['gyeol','네, 그럴게요.'],
    ['hun','그래요. 누구나 처음엔 쑥스럽지만, 두세 번 나가면 자연스러워져 내 집처럼 편안해지지요. 다음 주에는 함께 예배 드리고 새가족반으로 안내해 드릴게요. 지난주에 요한복음 6장 47절을 함께 나누었는데 혹시 기억나세요?'],
    ['gyeol','네, 기억해요. “진실로 진실로 너희에게 이르노니 믿는 자는 영생을 가졌나니”'],
    ['hun','이 말씀은 신실하신 하나님의 약속이지요. 만약 자매님이 이 세상을 떠나 하나님 앞에 섰을 때 “내가 너를 나의 천국에 들어오게 해야 할 이유가 무엇이냐”고 물으신다면 어떻게 대답하시겠어요?'],
    ['gyeol','예수님을 믿기 때문이지요.'],
    ['hun','그러면 오늘 이 세상을 떠나신다면 어디로 갈 것을 확신하십니까?'],
    ['gyeol','천국이지요.'],
    ['hun','그렇지요, 천국이지요. 자신 있게 대답해 주셔서 기뻐요. 이렇게 천국에 들어갈 하나님의 자녀로 태어났다면, 잘 자라기 위해 해야 할 다섯 가지가 있어요. 기억나세요?'],
    ['hun','첫째, 성경을 읽으셔야 해요. 성경은 영혼의 양식이지요. 요한복음을 읽어보셨나요?'],
    ['gyeol','아니요, 못 읽었어요.'],
    ['hun','처음엔 잘 안되지요. 그래도 하루에 한 장씩만 읽어 나가세요. 10분이면 충분해요. 모르는 건 제가, 제가 모르면 목사님께 여쭤서 알려드릴게요. ‘함께 성장해요’는 읽어 보셨나요?'],
    ['gyeol','예, 읽었어요. 제가 영생 얻은 것에 대해 더욱 확실히 알게 되었어요.'],
    ['hun','네, 잘하셨어요. 둘째, 기도하세요. 기도는 하나님과의 대화이며 영적 호흡이지요. 다섯 손가락으로 기도하는 방법 기억하시지요? 다시 한번 해 볼까요 — 하나님 아버지 / 감사합니다 / 용서해주세요 / 도와주세요! / 예수님의 이름으로 기도합니다, 아멘. 그리고 기도하실 때 저희를 위해서도 기도해 주시겠어요?'],
    ['gyeol','네, 잘 하지는 못하지만 배운 대로 해 보지요.'],
    ['hun','감사합니다. (‘함께 기도해요’ 소책자를 드리며) 이 책이 도움이 될 거예요. 셋째, 예배에 참석하셔야 돼요. 성경을 바로 가르치는 교회에 정기적으로 나가 예배드리는 거예요. 이번 주엔 나오셔서 예배드려요.'],
    ['gyeol','예, 꼭 나가겠습니다.'],
    ['hun','지난번에 예배시간을 알려드렸지요. 10시, 12시 예배가 있는데 어느 시간이 좋으세요?'],
    ['gyeol','10시가 좋겠는데요.'],
    ['hun','그러면 이번 주엔 제가 9시 20분까지 댁으로 오겠습니다. 넷째는 교제입니다. 믿음 안에서 함께 성장할 그리스도인들과 교제할 때 믿음이 자라요. 마침 목장모임이 매주 금요일에 있는데 참석하시면 좋겠어요. 이번 주말쯤 저녁식사에 초대하고 싶은데 괜찮으세요? 남편분과 함께 오세요.'],
    ['gyeol','감사합니다. 남편과 의논해서 연락드리겠습니다.'],
    ['hun','마지막 다섯째는 전도하셔야 돼요. 예수 그리스도가 누구신지 다른 사람에게 전하는 전도자가 되는 거예요. 자매님은 제일 먼저 누구에게 전하고 싶으세요?'],
    ['gyeol','글쎄요… 우리 가족이지요.'],
    ['hun','처음엔 조금 어려우실 거예요. 제가 가서 좀 도와 드리면 어떨까요?'],
    ['gyeol','그럼 더 좋지요.'],

/* ---------------- Storage-backed checklist state ---------------- */
let CHECKED = {};
const STORAGE_KEY = 'jee61-manual-checklist';

/* ---------------- Skin & font-size preferences ---------------- */
const PREF_KEY = 'jee61-manual-prefs';
const FONT_SCALES = [0.85, 1, 1.15, 1.3];
const FONT_LABELS = ['작게', '보통', '크게', '아주크게'];
let fontScaleIndex = 1;
let currentTheme = 'navy';

async function loadPrefs(){
  try{
    const res = await window.storage.get(PREF_KEY, false);
    if(res && res.value){
      const p = JSON.parse(res.value);
      if(typeof p.fontScaleIndex === 'number' && FONT_SCALES[p.fontScaleIndex] !== undefined){
        fontScaleIndex = p.fontScaleIndex;
      }
      if(p.theme){ currentTheme = p.theme; }
    }
  }catch(e){ /* no saved prefs yet */ }
}
async function savePrefs(){
  try{ await window.storage.set(PREF_KEY, JSON.stringify({fontScaleIndex, theme: currentTheme}), false); }
  catch(e){ console.error('설정 저장 실패', e); }
}
function applyPrefs(){
  document.documentElement.style.setProperty('--font-scale', FONT_SCALES[fontScaleIndex]);
  document.body.setAttribute('data-theme', currentTheme);
  document.querySelectorAll('.theme-swatch').forEach(el=>{
    el.classList.toggle('active', el.dataset.theme === currentTheme);
  });
  document.getElementById('fontSizeLabel').textContent = FONT_LABELS[fontScaleIndex];
  document.getElementById('fontMinus').disabled = fontScaleIndex === 0;
  document.getElementById('fontPlus').disabled = fontScaleIndex === FONT_SCALES.length - 1;
}
function initPrefControls(){
  document.querySelectorAll('.theme-swatch').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTheme = btn.dataset.theme;
      applyPrefs();
      savePrefs();
    });
  });
  document.getElementById('fontMinus').addEventListener('click', ()=>{
    if(fontScaleIndex > 0){ fontScaleIndex--; applyPrefs(); savePrefs(); }
  });
  document.getElementById('fontPlus').addEventListener('click', ()=>{
    if(fontScaleIndex < FONT_SCALES.length - 1){ fontScaleIndex++; applyPrefs(); savePrefs(); }
  });
}

/* ---------------- Floating home button ---------------- */
function initHomeButton(){
  const btn = document.getElementById('homeBtn');
  btn.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
  window.addEventListener('scroll', ()=>{
    btn.classList.toggle('show', window.scrollY > 240);
  }, {passive:true});
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ CHECKED = JSON.parse(res.value); }
  }catch(e){ /* no saved state yet */ }
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(CHECKED), false); }
  catch(e){ console.error('저장 실패', e); }
}

function esc(s){ return s; }

function countableIds(section){
  // returns list of unique keys for checkable items in a section
  if(section.type==='checklist') return section.items.map((_,i)=>`${section.id}-i${i}`);
  if(section.type==='outline') {
    let keys=[];
    section.duties.forEach((d,di)=>d.subs.forEach((_,si)=>keys.push(`${section.id}-d${di}s${si}`)));
    return keys;
  }
  if(section.type==='report') return section.rules.map((_,i)=>`${section.id}-r${i}`);
  if(section.type==='qq') return section.questions.map((_,i)=>`${section.id}-q${i}`);
  return [];
}

function sectionProgress(section){
  const keys = countableIds(section);
  if(keys.length===0) return null;
  const done = keys.filter(k=>CHECKED[k]).length;
  return {done, total:keys.length};
}

function toggleCheck(key){
  CHECKED[key] = !CHECKED[key];
  saveState();
  render();
}

/* ---------------- Rendering ---------------- */
let openSection = null;

function checkIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
}

function renderPath(){
  const wrap = document.getElementById('pathWrap');
  wrap.innerHTML = '';
  SECTIONS.forEach((s, idx)=>{
    const prog = sectionProgress(s);
    const done = prog ? prog.done===prog.total : false;
    const btn = document.createElement('button');
    btn.className = 'path-step' + (s.id===openSection?' active':'') + (done?' done':'');
    btn.innerHTML = `<div class="path-dot"></div><div class="path-label">${s.id}</div>`;
    btn.onclick = ()=>{ openSection = s.id; render(); document.getElementById('sec-'+s.id).scrollIntoView({behavior:'smooth', block:'start'}); };
    wrap.appendChild(btn);
    if(idx < SECTIONS.length-1){
      const line = document.createElement('div');
      line.className = 'path-line' + (done?' done':'');
      wrap.appendChild(line);
    }
  });
}

function renderSummary(){
  let done=0, total=0;
  SECTIONS.forEach(s=>{
    const p = sectionProgress(s);
    if(p){ done+=p.done; total+=p.total; }
  });
  document.getElementById('summaryCount').textContent = `${done}/${total}`;
  document.getElementById('summaryFill').style.width = total? `${Math.round(done/total*100)}%` : '0%';
}

function itemHtml(section, i, item){
  const key = `${section.id}-i${i}`;
  const checked = !!CHECKED[key];
  return `<div class="item ${checked?'checked':''}">
    <div class="check" data-key="${key}">${checkIcon()}</div>
    <div>
      <span class="item-text">${item.t}</span>
      ${item.note? `<span class="item-note">${item.note}</span>`:''}
    </div>
  </div>`;
}

function bodyHtml(section){
  if(section.type==='checklist'){
    return section.items.map((it,i)=>itemHtml(section,i,it)).join('');
  }
  if(section.type==='outline'){
    let html = `<p class="intro-text">${section.intro}</p>`;
    section.duties.forEach((d,di)=>{
      html += `<div class="duty"><div class="duty-title"><span class="duty-num">${di+1}</span>${d.title}</div>`;
      d.subs.forEach((sub,si)=>{
        const key = `${section.id}-d${di}s${si}`;
        const checked = !!CHECKED[key];
        html += `<div class="item ${checked?'checked':''}">
          <div class="check" data-key="${key}">${checkIcon()}</div>
          <span class="item-text">${sub}</span>
        </div>`;
      });
      html += `</div>`;
    });
    return html;
  }
  if(section.type==='report'){
    let html = `<p class="script-line">${section.formatLine}</p>`;
    html += `<div class="divider-label">보고 순서</div>`;
    section.order.forEach(o=> html += `<p class="para">${o}</p>`);
    html += `<div class="divider-label">유의사항</div>`;
    section.rules.forEach((r,i)=>{
      const key = `${section.id}-r${i}`;
      const checked = !!CHECKED[key];
      html += `<div class="rule">
        <div class="check" data-key="${key}" style="margin-top:0;">${checkIcon()}</div>
        <span class="item-text ${checked?'':''}" style="${checked?'color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#C9BC9C;':''}">${r}</span>
      </div>`;
    });
    html += `<div class="divider-label">결신율 계산</div><p class="script-line">${section.formula}</p>`;
    html += `<div class="divider-label">7일후 재방문</div><p class="para">${section.note7}</p>`;
    if(section.images && section.images.length){
      html += `<div class="divider-label">양식 샘플 (탭하면 크게 보기)</div>`;
      section.images.forEach(img=>{
        html += `<div class="form-ref">
          <img src="${IMAGES[img.src]}" data-full="${img.src}" alt="${img.label}">
          <div class="form-label">${img.label}</div>
        </div>`;
      });
    }
    return html;
  }
  if(section.type==='table'){
    let html = `<table class="diag"><tr><th>진단결과</th><th>① 천국확신</th><th>② 이유</th><th>내용</th></tr>`;
    section.rows.forEach(row=>{
      html += `<tr><td class="result ${row.cls}">${row.r}</td><td>${row.q1}</td><td>${row.q2}</td><td>${row.desc}</td></tr>`;
    });
    html += `</table><p class="para" style="font-size:12px;color:var(--ink-soft);">${section.footnote}</p>`;
    return html;
  }
  if(section.type==='dialogue'){
    let html = `<div class="dialogue">`;
    section.dialogue.forEach(([spk,text])=>{
      const cls = spk==='hun'?'hun':'gyeol';
      const label = spk==='hun'?'훈련자':'결신자';
      html += `<div class="turn ${cls}"><div class="bubble"><span class="speaker">${label}</span>${text}</div></div>`;
    });
    html += `</div>`;
    return html;
  }
  if(section.type==='script'){
    let html = '';
    section.intro.forEach(p=> html += `<p class="para">${p}</p>`);
    html += `<div class="divider-label">진행 순서</div>`;
    section.steps.forEach((s,i)=>{
      html += `<div class="script-line"><b>${i+1}.</b> ${s}</div>`;
    });
    return html;
  }
  if(section.type==='qq'){
    let html = `<p class="script-line">${section.lead}</p>`;
    section.questions.forEach((q,i)=>{
      const key = `${section.id}-q${i}`;
      const checked = !!CHECKED[key];
      html += `<div class="qq-item">
        <div class="check" data-key="${key}" style="margin-top:1px;">${checkIcon()}</div>
        <span class="qq-num">${i+1}</span>
        <span class="item-text ${checked?'':''}" style="${checked?'color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#C9BC9C;':''}">${q}</span>
      </div>`;
    });
    html += `<p class="para" style="margin-top:12px;">${section.flow}</p>`;
    html += `<div class="divider-label">주요 기도내용</div>`;
    section.prayers.forEach((p,i)=> html += `<p class="para">${i+1}. ${p}</p>`);
    html += `<p class="para" style="font-style:italic;color:var(--ink-soft);">${section.note}</p>`;
    html += `<div class="divider-label">퀘이커 질문이란</div>`;
    section.background.forEach(p=> html += `<p class="para">${p}</p>`);
    return html;
  }
  return '';
}

function render(){
  renderPath();
  renderSummary();
  const main = document.getElementById('main');
  main.innerHTML = SECTIONS.map(s=>{
    const open = s.id===openSection;
    const prog = sectionProgress(s);
    const done = prog && prog.done===prog.total;
    return `<div class="card ${open?'open':''} ${done?'section-done':''}" id="sec-${s.id}">
      <button class="card-head" data-toggle="${s.id}">
        <div class="badge">${s.id}</div>
        <div class="head-text">
          <div class="head-title">${s.title}</div>
          <div class="head-meta">교재 ${s.page}${prog? ` · ${prog.done}/${prog.total} 체크완료`:''}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </button>
      <div class="card-body"><div class="card-body-inner">${open? bodyHtml(s) : ''}</div></div>
    </div>`;
  }).join('');

  main.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.dataset.toggle,10);
      openSection = (openSection===id) ? null : id;
      render();
    });
  });
  main.querySelectorAll('.check').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleCheck(el.dataset.key);
    });
  });
  main.querySelectorAll('.form-ref img').forEach(img=>{
    img.addEventListener('click', ()=>{
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('show');
    });
  });
}

document.getElementById('headerIcon').src = ICON1;
document.getElementById('lightbox').addEventListener('click', ()=>{
  document.getElementById('lightbox').classList.remove('show');
});

(async function init(){
  await loadPrefs();
  applyPrefs();
  initPrefControls();
  initHomeButton();
  await loadState();
  render();
})();
</script>
</body>
